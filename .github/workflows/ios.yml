name: Build and Sign iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Inject URL Schemes to Info.plist
        run: |
          INFOPLIST="ios/App/App/Info.plist"
          echo "Injecting URL Schemes into Info.plist..."
          
          # Use macOS native plutil to safely inject the custom URL types array
          plutil -insert CFBundleURLTypes -json '[{"CFBundleURLSchemes":["com.googleusercontent.apps.901513190581-kebnm9ij83851i249b10mk286gi2r0ov"]}]' "$INFOPLIST"

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install Provisioning Profile
        run: |
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 -d -o /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app

      - name: Build iOS app
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            DEVELOPMENT_TEAM=3N2S3HGDZ8 \
            -allowProvisioningUpdates

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>3N2S3HGDZ8</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.reforged.discipline</key>
              <string>Reforged Discipline Distribution 6</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates

      - name: Debug - Inspect entitlements and symbols
        run: |
          mkdir -p /tmp/ipa_inspect
          cd /tmp/ipa_inspect
          unzip -q $RUNNER_TEMP/export/App.ipa
          echo "=== Entitlements in exported app ==="
          codesign -d --entitlements :- Payload/App.app
          echo "=== Checking for WebBlockerPlugin symbol in binary ==="
          nm Payload/App.app/App | grep -i webblocker || echo "SYMBOL NOT FOUND"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/export/App.ipa
          issuer-id: ${{ secrets.APPLE_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_STORE_CONNECT_PRIVATE_KEY }}
